<header id="site-header">
</header>
<main class="page">
<p class="eyebrow">SECURE CHECKOUT</p>
<h1>Almost yours.</h1>
<div class="checkout-grid">
<form class="checkout-form" id="checkout-form">
<h2>Delivery details</h2>
<div class="two-col">
<label>Full name *<input name="customerName" required autocomplete="name">
</label>
<label>Mobile number *<input name="phone" type="tel" required autocomplete="tel">
</label>
</div>
<label>Email address *<input name="email" type="email" required autocomplete="email">
</label>
<label>Complete address *<textarea name="address" required rows="3" autocomplete="street-address">
</textarea>
</label>
<div class="three-col">
<label>City *<input name="city" required autocomplete="address-level2">
</label>
<label>State *<input name="state" required autocomplete="address-level1">
</label>
<label>PIN code *<input name="pin" inputmode="numeric" required autocomplete="postal-code">
</label>
</div>
<fieldset>
<legend>Payment method</legend>
<label class="radio">
<input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label>
<label class="radio">
<input type="radio" name="payment" value="Online Payment"> Online Payment <small>(integration ready)</small>
</label>
</fieldset>
<button class="button" type="submit">Place order</button>
</form>
<aside class="order-summary">
<h2>Order summary</h2>
<div id="checkout-items">
</div>
</aside>
</div>
<section id="order-confirmation" class="confirmation hidden">
<p class="eyebrow">ORDER CONFIRMED</p>
<h2>Thank you for choosing Kota Kurtis.</h2>
<p>We’ve received your order and will be in touch shortly with your confirmation.</p>
<a class="button" href="index.html">Continue shopping</a>
</section>
</main>
<footer id="site-footer">
</footer>
<button id="back-top" aria-label="Back to top">↑</button>
<div id="toast" aria-live="polite">
</div>
<script src="script.js">
</script>
</body>
